name: Build PDF

# Build on every push to main, on every PR, on any v* tag (which also
# publishes a GitHub Release), and on demand from the Actions tab.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch/tag are cancelled (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the release job asks for write access itself.
permissions:
  contents: read

jobs:
  build:
    name: Compile (latexmk + XeLaTeX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Uses a prebuilt full TeX Live Docker image and drives latexmk, which
      # reads .latexmkrc (XeLaTeX, shell escape, output dir "build/").
      - name: Compile PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: project-management.tex
          compiler: latexmk
          latexmk_use_xelatex: true    # fontspec in the preamble requires XeLaTeX/LuaLaTeX
          latexmk_shell_escape: true   # minted + markdown shell out to helper programs

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: build/project-management.pdf
          if-no-files-found: error

  release:
    name: Attach PDF to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write    # required to create the release

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: dist

      # Creates the release for the pushed tag (or updates it if it exists)
      # and attaches the freshly built PDF as a downloadable asset.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/project-management.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
